{% extends 'basemain.html' %}
{% load static %}

{% block content %}

<section class="py-20 bg-gray-50 pt-28">
    <div class="max-w-3xl mx-auto px-4">

        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-qtdBlue">Course Registration</h2>
            <p class="text-gray-500 mt-2">Fill out the form below to register your spot. No login required.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg text-sm border {% if message.tags == 'success' %}bg-green-100 text-green-700 border-green-200{% else %}bg-red-100 text-red-700 border-red-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Full Name *</label>
                    <input type="text" name="full_name" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition">
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Phone Number *</label>
                    <input type="text" name="phone" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition">
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Email Address</label>
                    <input type="email" name="email"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition">
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Select Course *</label>
                    <select name="course" required
                            class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition bg-white">
                        <option value="">-- Choose a course --</option>
                        {% for c in courses %}
                            <option value="{{ c.id }}" {% if course and course.id == c.id %}selected{% endif %}>
                                {{ c.title }}
                            </option>
                        {% empty %}
                            <option value="" disabled>No courses currently available</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Preferred Start Date & Time</label>
                    <input type="text" name="preferred_date" placeholder="e.g., Next Monday, Morning sessions"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition">
                </div>

                <div>
                    <span class="block font-semibold mb-2 text-gray-700">Experience Level *</span>
                    <div class="flex gap-6 mt-2">
                        <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="experience_level" value="Beginner" required class="text-qtdGold focus:ring-qtdGold">
                            Beginner
                        </label>
                        <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                            <input type="radio" name="experience_level" value="Some Experience" required class="text-qtdGold focus:ring-qtdGold">
                            Some Experience
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-gray-700">Comments</label>
                    <textarea name="comments" rows="4"
                              class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-qtdGold focus:border-qtdGold focus:outline-none transition"></textarea>
                </div>

                <div class="text-center pt-2">
                    <button type="submit"
                            class="px-8 py-3 bg-qtdGold text-white rounded-lg font-bold hover:bg-amber-600 transition shadow-md shadow-qtdGold/10">
                        Submit Registration
                    </button>
                </div>

            </form>
        </div>
    </div>
</section>

{% endblock %}
